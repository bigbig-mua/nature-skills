name: Sync Nature Skills for CC Switch

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-nature-skills-cc-switch
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'bigbig-mua/nature-skills'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync the two skill directories and license
        shell: bash
        run: |
          set -euo pipefail

          upstream="$RUNNER_TEMP/nature-skills-upstream"
          archive="$RUNNER_TEMP/nature-skills-cc-switch.tar"
          paths=(LICENSE skills/nature-polishing skills/nature-shared)

          git clone --quiet --depth=1 --filter=blob:none --sparse --branch main \
            https://github.com/Yuan1z0825/nature-skills.git "$upstream"
          git -C "$upstream" sparse-checkout set skills/nature-polishing skills/nature-shared
          for required in LICENSE skills/nature-polishing/SKILL.md skills/nature-shared/SKILL.md; do
            test -s "$upstream/$required"
          done
          upstream_sha=$(git -C "$upstream" rev-parse HEAD)
          git -C "$upstream" archive --format=tar --output="$archive" HEAD -- "${paths[@]}"

          if git ls-remote --exit-code --heads origin refs/heads/cc-switch >/dev/null; then
            git fetch --no-tags --depth=1 origin refs/heads/cc-switch
            git switch --create cc-switch FETCH_HEAD
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then
              exit "$status"
            fi
            git switch --orphan cc-switch
          fi

          while IFS= read -r -d '' path; do
            case "$path" in
              LICENSE|skills/nature-polishing/*|skills/nature-shared/*) ;;
              *)
                printf 'Unexpected file on cc-switch: %s\n' "$path" >&2
                exit 1
                ;;
            esac
          done < <(git ls-files -z)

          git rm -r --ignore-unmatch -- "${paths[@]}"
          tar -xf "$archive"
          git add -A -- "${paths[@]}"

          if git diff --cached --quiet; then
            printf 'Already synchronized with upstream %s\n' "$upstream_sha"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Sync Nature Skills from ${upstream_sha:0:12}" \
            -m "Upstream: https://github.com/Yuan1z0825/nature-skills/commit/$upstream_sha"
          git push origin HEAD:refs/heads/cc-switch
