name: Sync Nature Skills for CC Switch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-nature-skills-cc-switch
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'bigbig-mua/nature-skills' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync Nature Polishing and its shared dependency
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags --depth=1 origin refs/heads/cc-switch
          git switch --create cc-switch FETCH_HEAD

          while IFS= read -r -d '' path; do
            case "$path" in
              LICENSE|skills/nature-polishing/*|skills/nature-shared/*) ;;
              *)
                printf 'Unexpected file on cc-switch: %s\n' "$path" >&2
                exit 1
                ;;
            esac
          done < <(git ls-files -z)

          git -c http.https://github.com/.extraheader= fetch --no-tags --depth=1 \
            https://github.com/Yuan1z0825/nature-skills.git refs/heads/main
          upstream_sha=$(git rev-parse FETCH_HEAD)
          for path in LICENSE skills/nature-polishing/SKILL.md skills/nature-shared/SKILL.md; do
            git cat-file -e "$upstream_sha:$path"
          done

          # Match the upstream paths exactly, including removals within both skills.
          git restore --source="$upstream_sha" --staged --worktree --no-overlay -- \
            LICENSE skills/nature-polishing skills/nature-shared

          if git diff --cached --quiet; then
            printf 'Already synchronized with upstream %s\n' "$upstream_sha"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Sync Nature Skills from ${upstream_sha:0:12}" \
            -m "Upstream: https://github.com/Yuan1z0825/nature-skills/commit/$upstream_sha"
          git push origin HEAD:refs/heads/cc-switch
